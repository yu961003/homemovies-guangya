# ─────────────────────────────────────────────────────────────────────────────
# 内存配置（2026-10-28 修正）
#
# 背景：CI 报
#     FAILURE: Execution failed for task ':app:compileDebugKotlin'
#     > Not enough memory to run compilation. Try to increase it via 'gradle.properties':
#       kotlin.daemon.jvmargs=-Xmx<size>
# 紧接在它前面那条 `Couldn't transform method node: CustomJsonMappingDialog$lambda$13`
# 是同一件事的症状：Kotlin 后端在堆耗尽时抛出的就是这类 codegen 异常。
# 原来的 kotlin.daemon.jvmargs=-Xmx768m 对 307 个 .kt 文件 + Compose 编译器插件
# （K2 IR 转换 + sourceInformation 指令生成，会产出大量合成类）明显不够。
#
# 取值依据（重要，换 runner 规格要复核）：
#   - Gradle daemon 和 Kotlin daemon 是**两个独立 JVM**，Xmx 会叠加。
#   - GitHub 托管 runner：公开仓库 4 vCPU / 16GB；私有仓库免费档 2 vCPU / 7GB。
#   - 下面这组 2.5g + 3g ≈ 5.5g 堆，两个档位都跑得下；若确认是 16GB runner，
#     可再把 kotlin.daemon.jvmargs 提到 -Xmx4g（编译更快，但不是必需）。
#   - 不要把两个都拉到 4g：在 7GB runner 上会触发 OOM-killer，
#     表现是构建被 SIGKILL 直接中断，而不是给出这么清晰的报错。
#   - MaxMetaspaceSize 保持 768m 偏保守：Compose 插件合成类多，768m 是够的，
#     真正的瓶颈在堆不在 metaspace。
# ─────────────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m

# workers.max=2 保持不变：编译期的内存瓶颈来自单个 Kotlin daemon 的堆，
# 加 worker 只会让多个 ABI 的 CMake 并行抢内存，反而更容易触发 OOM。
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
ksp.incremental=false
ksp.incremental.intermodule=false
