name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AssembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- 自动解压唯一的 ZIP（智能查找 gradlew 所在目录） ---
      - name: Unzip source code
        id: unzip
        run: |
          echo "📂 当前根目录内容："
          ls -la

          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 错误：未找到任何 .zip 文件"
            exit 1
          fi

          ZIP_COUNT=$(ls *.zip 2>/dev/null | wc -l)
          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo "⚠️ 警告：检测到多个 .zip 文件，将使用第一个：$ZIP_FILE"
          fi

          echo "📦 解压 $ZIP_FILE ..."
          TMP_DIR=$(mktemp -d)
          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          # 智能查找 gradlew 所在目录（兼容 ZIP 内含一层根目录的情况）
          GRADLEW_DIR=$(find "$TMP_DIR" -type f -name gradlew | head -n 1 | xargs -r dirname)
          if [ -z "$GRADLEW_DIR" ]; then
            echo "❌ 错误：解压后未找到 gradlew，请确认 ZIP 内含 Android 工程"
            exit 1
          fi

          echo "📍 工程根目录：$GRADLEW_DIR"
          # 将工程内容落地到仓库根目录，使后续步骤可直接使用 ./gradlew
          # checkout 已在 $GITHUB_WORKSPACE 落下 .github（含本工作流自身），与
          # ZIP 内的 .github 同名且非空，直接 mv 会报 "Directory not empty" 而失败。
          # 因此逐条处理：同名目录用 cp -a 递归并入，其余（含 .git 防护）直接 mv。
          shopt -s dotglob
          for entry in "$GRADLEW_DIR"/*; do
            name=$(basename "$entry")
            if [ "$name" = ".git" ]; then
              continue   # 绝不覆盖 checkout 生成的 .git
            fi
            if [ -d "$entry" ] && [ -d "$GITHUB_WORKSPACE/$name" ]; then
              cp -a "$entry"/. "$GITHUB_WORKSPACE/$name"/
            else
              mv "$entry" "$GITHUB_WORKSPACE"/
            fi
          done
          shopt -u dotglob

          echo "✅ 解压完成"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build debug APK (skip lint)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14