name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AssembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- 自动解压唯一的 ZIP 文件（放最前面） ---
      - name: Unzip source code
        run: |
          echo "📂 当前根目录内容："
          ls -la

          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 错误：未找到任何 .zip 文件"
            exit 1
          fi
          ZIP_COUNT=$(ls *.zip 2>/dev/null | wc -l)
          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo "⚠️ 警告：找到多个 .zip 文件，将只处理第一个：$ZIP_FILE"
          fi
          echo "📦 找到 ZIP 文件：$ZIP_FILE"

          unzip -o "$ZIP_FILE"

          BASE_NAME=$(basename "$ZIP_FILE" .zip)
          if [ ! -f "gradlew" ] && [ -d "$BASE_NAME" ]; then
            echo "📁 检测到外层父文件夹 $BASE_NAME，正在迁移内容到根目录..."
            mv "$BASE_NAME"/* . 2>/dev/null || true
            mv "$BASE_NAME"/.[!.]* . 2>/dev/null || true
            rmdir "$BASE_NAME" 2>/dev/null || true
          fi

          if [ ! -f "gradlew" ]; then
            echo "❌ 错误：解压后未找到 gradlew 文件"
            exit 1
          fi

          echo "✅ 解压并整理完成，当前根目录内容："
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --- 新增：用官方 Gradle 行动替代单独的 wrapper-validation，自带缓存 ---
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 启用构建缓存（默认就是 true，可省略）
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (skip lint)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
