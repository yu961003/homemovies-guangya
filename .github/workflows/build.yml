name: Build Debug APK (光鸭云盘)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码（已升级到v5）
      - name: Checkout
        uses: actions/checkout@v5

      # 2. 【手机专用】解压你上传的代码压缩包
      - name: Unzip source code
        run: unzip -o HomeMovie-Guangya.zip

      # 3. 设置 Java 环境（已升级到v5）
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 4. 【核心修复】手动指定系统自带的 Android SDK，不再使用报错的第三方工具
      - name: Set Android SDK path
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      # 5. 缓存 Gradle（已升级到v5）
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. 同意 Android SDK 许可证（利用刚才设置的路径）
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      # 7. 安装你项目需要的 SDK 版本（这里以 android-35 为例）
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # 8. 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 9. 正式打包 APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 10. 上传 APK（已升级到v5）
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
