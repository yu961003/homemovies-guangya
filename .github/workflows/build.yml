name: Build Debug APK (光鸭云盘)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 【修复】精确匹配你的文件名，并自动剥离可能多出的外层文件夹
      - name: Unzip source code
        run: |
          echo "📂 当前根目录文件列表："
          ls -la
          echo "📦 开始解压 HomeMovie-Guangya.zip ..."
          unzip -o HomeMovie-Guangya.zip
          # 如果解压后多了一层 HomeMovie-Guangya 文件夹，把里面的内容全部上移
          if [ -d "HomeMovie-Guangya" ]; then
            echo "📁 检测到外层父文件夹，正在迁移内部文件到根目录..."
            mv HomeMovie-Guangya/* . 2>/dev/null || true
            mv HomeMovie-Guangya/.[!.]* . 2>/dev/null || true
            rmdir HomeMovie-Guangya 2>/dev/null || true
          fi
          echo "✅ 整理后的根目录文件列表（必须能看到 gradlew 和 app 文件夹）："
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set Android SDK path
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      # 【修复】新增 ndk;27.0.12077973：media3-exoplayer-ffmpeg 带入预编译原生库，
      #          assembleDebug 打包时需 NDK 的 strip 工具对 .so 去符号，否则 stripDebugDebugSymbols 会失败。
      #          版本需与 app/build.gradle.kts 中的 ndkVersion 一致。
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
