name: build-apk

# ─────────────────────────────────────────────────────────────────────────────
# 在 CI 里构建带 libmpv 的 APK。
#
# 为什么单独一个 workflow 而不是塞进 build-libmpv：libmpv 是真·交叉编译
# （meson + ninja + 一整棵 FFmpeg/libass/placebo 依赖树，40~90 分钟、十几 GB），
# APK 侧只是 Gradle 十几分钟。两者失败原因完全不同，塞一起既浪费排队时间，
# 也让「到底是库编坏了还是工程编坏了」在日志里分不清。
#
# 所以这里**不编 libmpv**，只下载 build-libmpv 已经产出的 artifact，装进
# jniLibs 再编 APK。顺序是：
#   1) 先手动跑一次 build-libmpv（Actions → build-libmpv → Run workflow）
#   2) 再跑本 workflow
#
# 关键点：仓库里不提交 .so，所以「下载 artifact → 放进 jniLibs」这一步一旦漏掉，
# verifyMpvNativeLibs 就会失败（这正是它存在的意义）。本 workflow 把它做成
# 必经步骤，而不是每次靠人记得。
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      abis:
        description: '要打进 APK 的 ABI（逗号分隔）'
        required: false
        default: 'arm64-v8a'
      yaozhi:
        description: '使用打过 Yaozhi 补丁的 libmpv artifact（libmpv-<abi>-yaozhi）'
        required: false
        type: boolean
        default: false
      libmpv_run_id:
        description: '指定 build-libmpv 的 run id（留空 = 取最近一次成功的）'
        required: false
        default: ''
  push:
    branches: ['release/**']
    paths:
      - 'app/**'
      - 'scripts/assemble-libmpv-jnilibs.py'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # ABIS 不在这里定：自带库时要以 jniLibs 实际目录为准，见「确定本次要编的 ABI」
  # artifact 名后缀：build-libmpv 里 yaozhi=true 时会加 -yaozhi
  ARTIFACT_SUFFIX: ${{ github.event.inputs.yaozhi == 'true' && '-yaozhi' || '' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout 工程
        uses: actions/checkout@v4

      # 交付的单文件 zip 可以自带库（只带 arm64 一套，塞得进 24 MB 上传上限），
      # 这样 CI 根本不需要先跑 40~90 分钟的 build-libmpv；只推源码的人走 artifact
      # 那条路。两条路在这里分叉，后面的步骤只认 $ABIS。
      - name: 检测 jniLibs 是否已自带库
        id: bundled
        shell: bash
        run: |
          set -euo pipefail
          abis=""
          for d in app/src/main/jniLibs/*/; do
            [ -d "$d" ] || continue
            if compgen -G "$d*.so" > /dev/null; then
              abis="${abis:+$abis,}$(basename "$d")"
            fi
          done
          if [ -n "$abis" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "abis=$abis" >> "$GITHUB_OUTPUT"
            echo "仓库里已自带库：$abis —— 跳过 artifact 下载与装配"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "仓库里没有 .so —— 走 build-libmpv artifact 那条路"
          fi

      # 自带库时以实际目录为准，避免输入写错（包里只有 arm64 却填了 x86_64）
      # 导致下游失配；走 artifact 时按输入来。
      - name: 确定本次要编的 ABI
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.bundled.outputs.present }}" = "true" ]; then
            echo "ABIS=${{ steps.bundled.outputs.abis }}" >> "$GITHUB_ENV"
          else
            echo "ABIS=${{ github.event.inputs.abis || 'arm64-v8a' }}" >> "$GITHUB_ENV"
          fi

      - name: 校验参数
        shell: bash
        run: |
          set -euo pipefail
          echo "ABIS=$ABIS"
          echo "自带库: ${{ steps.bundled.outputs.present }}"
          for abi in ${ABIS//,/ }; do
            case "$abi" in
              arm64-v8a|armeabi-v7a|x86_64) ;;
              *) echo "::error::不支持的 ABI: $abi"; exit 1 ;;
            esac
          done

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带的 SDK 里通常没有工程 pin 的 NDK 27（AGP 会尝试自动下载，
      # 但失败时常给一句很含糊的“NDK not configured”）。显式装一次，报错更早更清楚。
      - name: 安装 NDK / CMake
        shell: bash
        run: |
          set -euo pipefail
          # runner 镜像里 cmdline-tools 的位置随镜像版本变过，别假定 latest 一定在
          SDKM=$(command -v sdkmanager || true)
          if [ -z "$SDKM" ]; then
            for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                     "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                     "$ANDROID_HOME/tools/bin/sdkmanager"; do
              if [ -x "$c" ]; then SDKM="$c"; break; fi
            done
          fi
          if [ -z "$SDKM" ]; then
            echo "::error::找不到 sdkmanager（ANDROID_HOME=$ANDROID_HOME）"
            ls -R "$ANDROID_HOME" | head -40
            exit 1
          fi
          echo "sdkmanager: $SDKM"
          # `yes |` 在 pipefail 下会被 SIGPIPE 带成失败（yes 写满管道后被杀），
          # 用有限次输入代替。
          printf 'y\n%.0s' $(seq 1 40) | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          echo "NDK: $ANDROID_HOME/ndk/27.0.12077973"
          test -d "$ANDROID_HOME/ndk/27.0.12077973" || { echo "::error::NDK 装完仍不存在"; exit 1; }

      # 下载 libmpv 产物。
      #
      # 不用第三方 download-artifact action：它把 N 个 artifact 解到哪个子目录、
      # 层级怎么叠，各版本行为不一样，而这些 .so 每个 ABI 都是同名 9 个文件，
      # 一旦层级猜错就会把 A 架构的库塞进 B 的目录且不报错。
      # runner 自带 gh CLI，用 `gh run download -n <name> -D <dir>` 一 ABI 一目录，
      # 落盘位置完全确定。
      - name: 下载 libmpv artifact
        if: steps.bundled.outputs.present != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${{ github.event.inputs.libmpv_run_id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-libmpv.yml \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "::error::仓库里还没有成功的 build-libmpv 运行。先跑一次 build-libmpv，或填 libmpv_run_id。"
              exit 1
            fi
            echo "使用最近一次成功的 build-libmpv：run $run_id"
          else
            echo "使用指定 run：$run_id"
          fi
          echo "MPV_RUN_ID=$run_id" >> "$GITHUB_ENV"

          # 先看这个 run 到底产了哪些 artifact，错配时能直接看出原因
          echo "--- run $run_id 的 artifact ---"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            --jq '.artifacts[] | "\(.name)  \(.size_in_bytes) B  expired=\(.expired)"' || true

          for abi in ${ABIS//,/ }; do
            name="libmpv-$abi$ARTIFACT_SUFFIX"
            rm -rf "ci-libmpv/$abi"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "$name" -D "ci-libmpv/$abi" 2>/dev/null; then
              echo "::error::该 run 里没有 artifact「$name」。"
              echo "可能原因：那次 build-libmpv 只编了 arm64（默认），而本次 ABIS 含 $abi。"
              exit 1
            fi
            # upload-artifact 的根目录就是 jniLibs/<abi>/，所以 .so 通常平铺在根下；
            # 若某版本多包了一层，这里摊平，后续步骤只认 ci-libmpv/$abi/*.so。
            found=$(find "ci-libmpv/$abi" -name '*.so' | wc -l)
            if [ "$found" -gt 0 ] && ! compgen -G "ci-libmpv/$abi/*.so" > /dev/null; then
              inner=$(dirname "$(find "ci-libmpv/$abi" -name 'libmpv.so' | head -1)")
              echo "  $abi: 产物在子目录 $inner，摊平到 ci-libmpv/$abi/"
              mv -f "$inner"/*.so "ci-libmpv/$abi/"
              find "ci-libmpv/$abi" -mindepth 1 -type d -empty -delete
            fi
            echo "  $abi: $(find "ci-libmpv/$abi" -name '*.so' | wc -l) 个 .so"
          done

      - name: 装配进 jniLibs
        if: steps.bundled.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ls -la ci-libmpv/
          # ELF e_machine（e_ident 16B + e_type 2B → 偏移 18）：arm64=183 / arm=40 / x86_64=62
          # 用 od 读而不是 readelf：runner 上 od 一定在（build-libmpv 的页对齐检查也用它），
          # readelf 在部分精简镜像里没有。
          for abi in ${ABIS//,/ }; do
            case "$abi" in
              arm64-v8a)   want=183 ;;
              armeabi-v7a) want=40  ;;
              x86_64)      want=62  ;;
              *) echo "::error::未知 ABI $abi"; exit 1 ;;
            esac
            src="ci-libmpv/$abi"
            if ! compgen -G "$src/*.so" > /dev/null; then
              echo "::error::装配源没有 .so：$src"
              ls -R ci-libmpv | head -60
              exit 1
            fi
            # 架构自检：把别的 ABI 的库塞进来不会报错，但装到手机上会崩在
            # dlopen。这里用 ELF 头直接比，比“目录名对不对”可信。
            bad=0
            for so in "$src"/*.so; do
              got=$(od -An -tu2 -j18 -N2 "$so" | tr -d ' ')
              if [ "$got" != "$want" ]; then
                echo "::error::$(basename "$so") 的 e_machine=$got，与 $abi（期望 $want）不符"
                bad=1
              fi
            done
            [ "$bad" -eq 0 ] || exit 1
            mkdir -p "app/src/main/jniLibs/$abi"
            cp -f "$src"/*.so "app/src/main/jniLibs/$abi/"
            echo "$abi <- $src ($(ls "$src"/*.so | wc -l) 个 .so, e_machine=$want 校验通过)"
          done
          # AAR 自带的 libplayer.so 是上游 JNI 封装，会和本工程 cpp/ 的产物同名，
          # 绝不允许跟着进来。build-libmpv 的产物不该有它，这里再兜一层。
          find app/src/main/jniLibs -name libplayer.so -print -delete

      - name: 依赖闭包自检
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/assemble-libmpv-jnilibs.py --verify-only --abis "$ABIS"

      # 回环代理是这次修 -13 的核心：mpv 的 ffmpeg 走 mbedtls，不认系统 CA，也不带 UA，
      # 和 exo 的 OkHttp 网络栈不是一回事。代理把「怎么发请求」整体换成 OkHttp，
      # 于是所有 exo 能过的链路 mpv 也就能过。但代理一旦把字节改错（长度不符、
      # Content-Range 丢失、Range 没转发），症状仍是同一个 -13——比原来更难查。
      # 所以用一台本地假上游把「逐字节等价」钉死。这些用例不联网、不需要设备，几秒钟跑完。
      # 刻意放在 APK 上传之后（见文件末尾）：测试红了要让产物仍然拿得到，
      # 否则「测试挂 → 没 APK → 没法在真机验证修复」会变成一个死结。
      - name: 构建 APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -PmpvAbis="$ABIS"

      # 光“构建成功”不算数：stub 降级也会成功。这里直接查产物里有没有 libmpv.so，
      # 把「APK 真的能加载 mpv」变成 CI 的硬断言。
      - name: 断言 APK 内含 libmpv
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          echo "APK: $(stat -c %s "$apk") B"
          rc=0
          for abi in ${ABIS//,/ }; do
            n=$(unzip -l "$apk" | awk -v a="lib/$abi/" '$4 ~ (a ".*\\.so$") {c++} END {print c+0}')
            mpv=$(unzip -l "$apk" | grep -c "lib/$abi/libmpv.so$" || true)
            echo "  $abi: $n 个 .so, libmpv.so=$mpv"
            [ "$n" -ge 9 ] || { echo "::error::$abi 的 .so 不足 9 个"; rc=1; }
            [ "$mpv" -ge 1 ] || { echo "::error::$abi 没有 libmpv.so —— 又退化成 stub 了"; rc=1; }
          done
          exit $rc

      # https 直链能不能播，取决于 APK 里有没有那份 CA 包：
      # libavformat 是静态 mbedtls 构建，不读 Android 系统 CA，只能靠 --tls-ca-file
      # 指向随包分发的 PEM。这个断言把「CA 包被误删/未被打包」变成构建期失败，
      # 而不是等到用户在真机上看到 loading_failed（error=-13,reason=error/4）才发现。
      - name: 断言 APK 内含 CA 包（https 直链前提）
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f app/src/main/assets/mpv/cacert.pem || {
            echo "::error::缺少 app/src/main/assets/mpv/cacert.pem —— https 直链必然 -13"; exit 1; }
          bytes=$(stat -c %s app/src/main/assets/mpv/cacert.pem)
          echo "源 CA 包: $bytes B"
          [ "$bytes" -gt 65536 ] || { echo "::error::CA 包只有 $bytes B，明显被截断"; exit 1; }
          # grep -c 在 0 命中时退出码是 1，pipefail 下会直接把脚本打死且不留日志，
          # 所以显式吃掉退出码再自己断言，失败信息才看得懂。
          certs=$(grep -c "BEGIN CERTIFICATE" app/src/main/assets/mpv/cacert.pem || true)
          echo "证书数: $certs"
          [ "${certs:-0}" -gt 0 ] || { echo "::error::CA 包里没有任何 BEGIN CERTIFICATE"; exit 1; }
          inapk=$(unzip -l "$apk" | grep -c "assets/mpv/cacert.pem$" || true)
          echo "APK 内 assets/mpv/cacert.pem: $inapk"
          [ "$inapk" -ge 1 ] || {
            echo "::error::APK 里没有 assets/mpv/cacert.pem —— 打包链路把 asset 漏了"; exit 1; }

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}${{ env.ARTIFACT_SUFFIX }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 放在最后：APK 已经上传成功，就算下面这步红了，产物也还在，修复仍可上真机验证。
      # 反过来，测试红了 job 就是红的——不掩盖问题。
      - name: 单元测试（回环代理字节透明性）
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests '*MpvHttpProxyTest*' -PmpvAbis="$ABIS"
